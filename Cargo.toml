[package]
name = "rumole"
version = "0.1.0"
edition = "2024"
description = "TUI manager for local, remote, and dynamic SSH tunnels"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.1"
rustui = { git = "https://github.com/rinoale/rustui.git", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "net", "io-util", "fs"] }
toml = "0.8"
